name = "nuxt-ichibanboshi"
account_id = "24b45709d060d957340180e995f0d373"
main = "./.output/server/index.mjs"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".output/public"

# single-env (staging = prod)。PR を main に上げると CI がこの live worker
# (ichibanboshi.ippoan.org) に deploy する。別 staging worker は持たない。
[[routes]]
pattern = "ichibanboshi.ippoan.org"
custom_domain = true

[vars]
NUXT_PUBLIC_ALC_API_BASE = "https://alc-api.ippoan.org"
NUXT_PUBLIC_AUTH_WORKER_URL = "https://auth.ippoan.org"

# 売上 Worker (Service Binding 専用・公開の入口なし)。server/api/uriage の全口をここへ向ける。
# 書き込み系 (recalc・verify・admin) は Secrets Store の URIAGE_WRITE_TOKEN を
# X-Uriage-Write-Token に付ける (Refs ohishi-exp/rust-ichibanboshi#322)。
[[services]]
binding = "URIAGE"
service = "ichibanboshi-uriage"

[[secrets_store_secrets]]
binding = "URIAGE_WRITE_TOKEN"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "URIAGE_WRITE_TOKEN"

# 一番星 Worker (Service Binding 専用・認可なし)。一番星の 15 本 (employees・departments・sales 9・unchin 4)
# をここから取る (Refs ohishi-exp/rust-ichibanboshi#322)。
[[services]]
binding = "ICHIBAN_DB"
service = "ichibanboshi-ichiban"

# 運賃リスト (unchin/ prefix) の保存先 (server/utils/unchin.ts の getUnchinR2Bucket)。
# 担当者別売上 raw の R2 (uriage/ prefix) は売上 Worker が recalc のたびに直接 put する。
[[r2_buckets]]
binding = "URIAGE_R2"
bucket_name = "ichibanboshi-uriage"
